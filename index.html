<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="每日额度" />
    <meta name="format-detection" content="telephone=no" />
    <title>每日额度</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button" id="historyButton" type="button" aria-label="历史记录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2" /></svg>
        </button>
        <p class="date" id="todayDate"></p>
        <button class="icon-button" id="settingsButton" type="button" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.13.4.36.74.68 1 .3.26.7.4 1.1.4h.1v4h-.1a1.7 1.7 0 0 0-1.78.6Z" /></svg>
        </button>
      </header>

      <main>
        <section class="balance-card" aria-labelledby="balanceLabel">
          <p class="eyebrow" id="balanceLabel">今日剩余</p>
          <p class="balance" id="remainingAmount">¥0.00</p>
          <div class="summary-row">
            <div><span>今日额度</span><strong id="dailyLimit">¥0</strong></div>
            <div><span>今日已消费</span><strong id="todaySpent">¥0</strong></div>
          </div>
        </section>

        <button class="primary-button" id="addButton" type="button">记录消费</button>

        <section class="records-section" aria-labelledby="recordsTitle">
          <div class="section-heading">
            <h1 id="recordsTitle">今天记录</h1>
            <span id="recordCount"></span>
          </div>
          <div class="record-list" id="todayRecords"></div>
        </section>
      </main>
    </div>

    <dialog class="sheet" id="expenseDialog">
      <form method="dialog" id="expenseForm">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-header">
          <button class="text-button" value="cancel" type="button" data-close="expenseDialog">取消</button>
          <h2>记录消费</h2>
          <button class="text-button strong" id="confirmExpense" type="submit">确认</button>
        </div>
        <label class="amount-input-wrap">
          <span>¥</span>
          <input id="expenseAmount" name="amount" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" aria-label="消费金额" />
        </label>
        <p class="form-error" id="expenseError" role="alert"></p>
      </form>
    </dialog>

    <dialog class="page-dialog" id="settingsDialog">
      <form method="dialog" id="settingsForm" class="dialog-page">
        <div class="page-header">
          <button class="text-button" value="cancel" type="button" data-close="settingsDialog">取消</button>
          <h2>设置</h2>
          <button class="text-button strong" type="submit">保存</button>
        </div>
        <div class="form-card">
          <label for="limitAmount">每日额度</label>
          <div class="setting-input"><span>¥</span><input id="limitAmount" inputmode="decimal" autocomplete="off" /></div>
        </div>
        <p class="form-error inset" id="settingsError" role="alert"></p>
        <p class="form-note">修改后立即用于今天和之后的日期，不会影响已有消费记录。</p>
      </form>
    </dialog>

    <dialog class="page-dialog" id="historyDialog">
      <section class="dialog-page">
        <div class="page-header">
          <button class="text-button" type="button" data-close="historyDialog">完成</button>
          <h2>历史记录</h2>
          <span class="header-spacer"></span>
        </div>
        <div class="history-list" id="historyRecords"></div>
      </section>
    </dialog>

    <template id="emptyTemplate">
      <div class="empty-state">
        <div class="empty-icon">¥</div>
        <p>今天还没有消费</p>
      </div>
    </template>
  </body>
</html>
